<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        var queryString = window.location.search;
        var fullUrl = "https://thuanht-dev.github.io/deeplink_assets/signUp" + queryString;
        
        // Cố gắng mở App
        window.location.href = fullUrl;
        
        // Nếu sau 2 giây vẫn ở lại trang này, hiện nút bấm thủ công
        setTimeout(function() {
            document.getElementById("manual-link").style.display = "block";
        }, 2000);
    </script>
</head>
<body>
    <p>Đang chuyển hướng tới ứng dụng...</p>
    <div id="manual-link" style="display:none;">
        <p>Nếu ứng dụng không tự mở, hãy <a href="javascript:window.location.href = fullUrl;">nhấn vào đây để mở thủ công</a>.</p>
    </div>
</body>
</html>
