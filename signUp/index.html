<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
</head>
<body>
    <script>
        var queryString = window.location.search; // Lấy ?data=...
        var appStoreUrl = "https://play.google.com/store/apps/details?id=com.lapolo.medical&hl=vi"; // Thay bằng link App của bạn

        // 1. Thử mở App bằng scheme HTTPS (App Links)
        // Khi người dùng click, hệ thống sẽ tự tìm App có intent-filter khớp
        var intentUrl = "https://thuanht-dev.github.io/deeplink_assets/signUp" + queryString;
        window.location.href = intentUrl;

        // 2. Fallback: Nếu App không mở sau 1.5 giây, chuyển sang Store
        setTimeout(function() {
            window.location.href = appStoreUrl;
        }, 1500);
    </script>
    <p>Đang chuyển hướng tới ứng dụng...</p>
</body>
</html>
