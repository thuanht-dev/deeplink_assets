<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở ứng dụng LaPolo Medical</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 320px; }
        h2 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 2rem; }
        .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; margin-bottom: 10px; }
        .btn-open { background-color: #007bff; color: white; }
        .btn-store { background-color: #e9ecef; color: #495057; }
    </style>
</head>
<body>
    <div class="card">
        <h2>FaCare App</h2>
        <p>Tiếp tục thao tác trên ứng dụng để có trải nghiệm tốt nhất.</p>
        
        <a id="openAppBtn" class="btn btn-open">Mở trong ứng dụng</a>
        <a href="https://play.google.com/store/apps/details?id=com.lapolo.medical&hl=vi" class="btn btn-store">Tải ứng dụng</a>
    </div>

    <script>
        var queryString = window.location.search;
        var deepLink = "https://thuanht-dev.github.io/deeplink_assets/signUp" + queryString;
        
        // Gán link cho nút bấm
        document.getElementById('openAppBtn').href = deepLink;

        // Tự động chuyển hướng sau 1s nếu người dùng không bấm gì
        setTimeout(function() {
            window.location.href = deepLink;
        }, 1000);
    </script>
</body>
</html>
