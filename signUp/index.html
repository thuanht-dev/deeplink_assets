<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mở ứng dụng FaCare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(circle at top left, #34d399 0%, transparent 40%),
                radial-gradient(circle at bottom right, #10b981 0%, transparent 40%),
                linear-gradient(135deg, #064e3b, #065f46);

            overflow: hidden;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;

            padding: 32px 24px;
            text-align: center;

            color: white;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);

            animation: fadeUp .5s ease;
        }

        .logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;

            border-radius: 24px;

            background: linear-gradient(135deg, #22c55e, #16a34a);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            box-shadow: 0 12px 32px rgba(34, 197, 94, .4);
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            line-height: 1.6;
            color: rgba(255, 255, 255, .85);
        }

        .loading {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, .75);
        }

        .spinner {
            width: 18px;
            height: 18px;

            border: 2px solid rgba(255, 255, 255, .25);
            border-top-color: white;
            border-radius: 50%;

            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;

            animation: spin 1s linear infinite;
        }

        .btn {
            display: none;

            width: 100%;
            margin-top: 24px;

            padding: 15px;

            border-radius: 16px;
            text-decoration: none;

            font-weight: 600;
            color: white;

            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #22c55e, #16a34a);

            box-shadow: 0 10px 20px rgba(34, 197, 94, .35);

            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, .55);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            💚
        </div>

        <h2>FaCare</h2>

        <p>
            Đang mở ứng dụng...
        </p>

        <div class="loading">
            <span class="spinner"></span>
            Vui lòng chờ trong giây lát
        </div>

        <a id="downloadBtn" class="btn" href="https://play.google.com/store/apps/details?id=com.lapolo.medical">
            📱 Tải ứng dụng FaCare
        </a>

        <div class="footer">
            Nếu ứng dụng chưa được cài đặt, hãy tải từ Google Play.
        </div>

    </div>

    <script>
        const packageName = "com.lapolo.medical";

        const intentUrl =
            "intent://" +
            window.location.host +
            window.location.pathname +
            window.location.search +
            "#Intent;" +
            "scheme=https;" +
            "package=" + packageName + ";" +
            "end;";

        const playStoreUrl =
            "https://play.google.com/store/apps/details?id=" + packageName;

        let appOpened = false;

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                appOpened = true;
            }
        });

        window.addEventListener("pagehide", () => {
            appOpened = true;
        });

        // Mở app
        setTimeout(() => {
            window.location.href = intentUrl;
        }, 100);

        // Fallback Play Store
        setTimeout(() => {
            if (!appOpened) {
                window.location.replace(playStoreUrl);
            }
        }, 2500);
    </script>

</body>

</html>
