<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Opening App...</title>
</head>
<body>
    <script>
        var queryString = window.location.search; // Lấy ?data=...
        
        // Cú pháp Intent URL chuẩn của Android
        // Thay com.your.package.name bằng package name thực tế của bạn
        // Ví dụ: com.thuanht.appname
        var intentUrl = "intent://signUp" + queryString + "#Intent;" +
                        "scheme=https;" +
                        "package=com.your.package.name;" + 
                        "host=thuanht-dev.github.io;" +
                        "path=/deeplink_assets/signUp;" +
                        "end;";

        // Tự động chuyển hướng
        window.location.replace(intentUrl);
    </script>
    <p>Đang mở ứng dụng, vui lòng đợi...</p>
</body>
</html>
