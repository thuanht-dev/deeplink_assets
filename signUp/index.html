<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mở ứng dụng FaCare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #4facfe 0%, transparent 40%),
        radial-gradient(circle at bottom right, #00f2fe 0%, transparent 40%),
        linear-gradient(135deg, #0f172a, #1e293b);
      padding: 20px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      color: white;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      animation: fadeUp 0.6s ease;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 10px 30px rgba(0, 114, 255, 0.4);
    }

    h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255,255,255,0.8);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 600;
      transition: all .25s ease;
      margin-bottom: 12px;
    }

    .btn-open {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      box-shadow: 0 10px 20px rgba(0,114,255,.35);
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0,114,255,.45);
    }

    .btn-store {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
    }

    .btn-store:hover {
      background: rgba(255,255,255,0.18);
    }

    .loading {
      margin-top: 18px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">💙</div>

    <h2>FaCare App</h2>

    <p>
      Tiếp tục thao tác trên ứng dụng để có trải nghiệm nhanh hơn,
      bảo mật hơn và đầy đủ tính năng.
    </p>

    <a id="openAppBtn" class="btn btn-open">
      🚀 Mở trong ứng dụng
    </a>

    <a
      href="https://play.google.com/store/apps/details?id=com.lapolo.medical&hl=vi"
      class="btn btn-store"
    >
      📱 Tải ứng dụng
    </a>

    <div class="loading">
      <span class="spinner"></span>
      Đang mở ứng dụng...
    </div>

    <div class="footer">
      Nếu ứng dụng không mở tự động, hãy nhấn nút phía trên.
    </div>
  </div>

  <script>
    const queryString = window.location.search;

    const deepLink =
      "https://thuanht-dev.github.io/deeplink_assets/signUp" +
      queryString;

    document.getElementById("openAppBtn").href = deepLink;

    setTimeout(() => {
      window.location.href = deepLink;
    }, 1200);
  </script>

</body>
</html>
